<!DOCTYPE html>

    <title>Spendly — Personal Expense Tracker & Budget Manager</title>
    <meta name="description" content="Spendly is a free, private expense tracker and budget manager. Log daily spending, set a monthly salary, see category reports and export PDF statements — synced securely across devices." />
    <meta name="application-name" content="Spendly" />
    <meta name="author" content="Spendly" />
    <meta name="robots" content="index, follow, max-image-preview:large" />
    <meta name="format-detection" content="telephone=no" />
    <meta name="google-site-verification" content="googlead8a6b8e6fd0f705" />
    <link rel="canonical" href="https://spendly-three-lemon.vercel.app/" />

    <!-- Google tag (gtag.js) - Google Analytics -->

      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-HJHDZNRJWY');
    </script>

    <!-- PWA / Mobile Web App Meta -->
    <meta name="theme-color" content="#030712" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Spendly" />

    <!-- Open Graph / Twitter Cards (canonical, og:url and og:image are injected at build time from VITE_SITE_URL) -->
    <meta property="og:site_name" content="Spendly" />
    <meta property="og:title" content="Spendly — Private Expense Tracker & Budget Manager" />
    <meta property="og:description" content="Track daily spending, plan your monthly budget and export PDF statements. Free, private and synced across devices." />
    <meta property="og:type" content="website" />
    <meta property="og:locale" content="en_IN" />
    <meta name="twitter:card" content="summary" />
    <meta name="twitter:title" content="Spendly — Private Expense Tracker & Budget Manager" />
    <meta name="twitter:description" content="Track daily spending, plan your monthly budget and export PDF statements. Free, private and synced across devices." />

    <!-- Structured data (SEO & GEO - Generative Engine Optimization) -->
    <script type="application/ld+json">
      {
        "@context": "https://schema.org",
        "@type": "WebApplication",
        "name": "Spendly",
        "url": "https://spendly-three-lemon.vercel.app/",
        "description": "Spendly is a free, privacy-first personal expense tracker, monthly budget planner, lending tracker, and EMI manager with real-time analytics and PDF export.",
        "applicationCategory": "FinanceApplication",
        "operatingSystem": "Any (Web, iOS, Android)",
        "browserRequirements": "Requires JavaScript",
        "featureList": [
          "Daily expense tracking with custom categories",
          "Monthly salary runway and balance forecasting",
          "Financial Hub: Lending, Borrowing, Cash Flow, Loan & EMI Tracker",
          "Private local storage with optional cloud backup",
          "Dark & light luxury glassmorphism UI",
          "PDF report statement generation"
        ],
        "offers": {
          "@type": "Offer",
          "price": "0",
          "priceCurrency": "INR"
        }
      }
    </script>

    <!-- Icons & Manifest -->

    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png?v=2" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png?v=2" />
    <link rel="shortcut icon" href="/favicon.ico?v=2" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2" />
    <link rel="manifest" href="/manifest.webmanifest?v=2" />

    <!-- Typography (only the families actually used by index.css) -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
