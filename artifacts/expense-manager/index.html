<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, shrink-to-fit=no, viewport-fit=cover"
    />

    <meta property="og:title" content="Spendly — Private Wealth & Expense Intelligence" />
    <meta property="og:description" content="A private, mindful personal finance and expense tracker built for everyday awareness." />
